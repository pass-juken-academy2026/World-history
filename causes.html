<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>世界史ポータル｜事件の因果関係・論述対策</title>

<style>
:root{
    --bg:#080d18;
    --bg2:#0e1626;
    --card:#141e31;
    --card2:#19253a;
    --line:#2a3a55;
    --text:#edf4ff;
    --sub:#aab8ce;

    --blue:#60a5fa;
    --cyan:#22d3ee;
    --green:#34d399;
    --yellow:#facc15;
    --orange:#fb923c;
    --red:#fb7185;
    --purple:#a78bfa;

    --shadow:0 15px 40px rgba(0,0,0,.32);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    color:var(--text);
    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(96,165,250,.10),
            transparent 27%
        ),
        radial-gradient(
            circle at 90% 5%,
            rgba(167,139,250,.08),
            transparent 25%
        ),
        var(--bg);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    line-height:1.75;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}


/* =========================
   HEADER
========================= */

header{
    padding:55px 20px 48px;
    border-bottom:1px solid var(--line);

    background:
        linear-gradient(
            135deg,
            rgba(96,165,250,.10),
            rgba(167,139,250,.08)
        );
}

.header-inner{
    max-width:1250px;
    margin:auto;
}

.back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:9px 15px;

    color:var(--text);
    text-decoration:none;

    background:rgba(255,255,255,.06);
    border:1px solid var(--line);
    border-radius:10px;

    transition:.2s;
}

.back-btn:hover{
    background:rgba(255,255,255,.12);
    transform:translateY(-1px);
}

.kicker{
    margin-top:34px;

    color:var(--cyan);

    font-size:.82rem;
    font-weight:900;

    letter-spacing:.13em;
}

h1{
    margin:8px 0 15px;

    font-size:clamp(2rem,5vw,3.6rem);
    line-height:1.15;
}

.header-description{
    max-width:900px;

    margin:0;

    color:var(--sub);
}


/* =========================
   MAIN
========================= */

main{
    max-width:1250px;
    margin:auto;

    padding:35px 20px 80px;
}


/* =========================
   INTRO
========================= */

.intro-box{
    margin-bottom:25px;

    padding:20px;

    background:
        linear-gradient(
            135deg,
            rgba(96,165,250,.08),
            rgba(167,139,250,.06)
        );

    border:1px solid var(--line);
    border-radius:15px;
}

.intro-box strong{
    color:var(--cyan);
}

.logic-flow{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;

    margin-top:14px;
}

.logic-item{
    padding:7px 12px;

    background:var(--card);
    border:1px solid var(--line);
    border-radius:999px;

    font-size:.85rem;
    font-weight:800;
}

.logic-arrow{
    color:var(--blue);
    font-weight:900;
}


/* =========================
   CONTROL PANEL
========================= */

.control-panel{
    position:sticky;
    top:10px;

    z-index:100;

    margin-bottom:30px;
    padding:16px;

    background:rgba(8,13,24,.94);

    backdrop-filter:blur(15px);

    border:1px solid var(--line);
    border-radius:16px;

    box-shadow:var(--shadow);
}

.search-row{
    display:grid;
    grid-template-columns:1fr auto;

    gap:10px;
}

.search{
    width:100%;

    padding:12px 14px;

    color:var(--text);

    background:var(--card);

    border:1px solid var(--line);
    border-radius:10px;

    outline:none;
}

.search:focus{
    border-color:var(--blue);

    box-shadow:
        0 0 0 3px
        rgba(96,165,250,.12);
}

.reset-btn{
    padding:0 17px;

    color:var(--text);

    background:var(--card2);

    border:1px solid var(--line);
    border-radius:10px;
}

.reset-btn:hover{
    background:#273753;
}

.filter-line{
    display:flex;
    align-items:center;
    flex-wrap:wrap;

    gap:7px;

    margin-top:12px;
}

.filter-label{
    width:65px;

    color:var(--sub);

    font-size:.8rem;
    font-weight:900;
}

.filter-btn{
    padding:5px 11px;

    color:var(--sub);

    background:var(--card);

    border:1px solid var(--line);
    border-radius:999px;

    transition:.2s;
}

.filter-btn:hover{
    color:var(--text);
}

.filter-btn.active{
    color:var(--blue);

    background:rgba(96,165,250,.13);

    border-color:
        rgba(96,165,250,.45);
}

.result-info{
    margin-top:12px;

    color:var(--sub);

    font-size:.82rem;
}


/* =========================
   SECTION
========================= */

.section-title{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;

    gap:15px;

    margin:38px 0 15px;
}

.section-title h2{
    margin:0;

    font-size:1.45rem;
}

.section-title span{
    color:var(--sub);

    font-size:.8rem;
}


/* =========================
   EVENT CARD
========================= */

.event-list{
    display:grid;

    gap:13px;
}

.event-card{
    overflow:hidden;

    background:var(--card);

    border:1px solid var(--line);
    border-radius:15px;

    transition:
        border-color .2s,
        box-shadow .2s,
        transform .2s;
}

.event-card:hover{
    border-color:#405576;

    box-shadow:var(--shadow);
}

.event-header{
    display:grid;
    grid-template-columns:
        95px
        1fr
        auto;

    align-items:center;

    gap:14px;

    padding:17px 18px;

    cursor:pointer;
}

.event-year{
    color:var(--cyan);

    font-size:.85rem;
    font-weight:900;
}

.event-title{
    margin:0;

    font-size:1.08rem;
    font-weight:900;
}

.event-subtitle{
    margin-top:3px;

    color:var(--sub);

    font-size:.82rem;
}

.event-meta{
    display:flex;
    align-items:center;

    gap:7px;
}

.badge{
    padding:3px 8px;

    font-size:.7rem;
    white-space:nowrap;

    border:1px solid var(--line);
    border-radius:999px;
}

.era-badge{
    color:var(--purple);
}

.region-badge{
    color:var(--cyan);
}

.arrow{
    margin-left:5px;

    color:var(--sub);

    font-size:1.1rem;

    transition:.25s;
}

.event-card.open .arrow{
    transform:rotate(180deg);
}


/* =========================
   CONTENT
========================= */

.event-content{
    display:none;

    padding:0 18px 20px;

    border-top:1px solid var(--line);
}

.event-card.open .event-content{
    display:block;

    animation:
        slideDown .22s ease;
}

@keyframes slideDown{
    from{
        opacity:0;
        transform:translateY(-6px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.detail-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:12px;

    margin-top:17px;
}

.detail-box{
    padding:17px;

    background:var(--bg2);

    border:1px solid var(--line);
    border-radius:12px;
}

.detail-box h3{
    display:flex;
    align-items:center;

    gap:7px;

    margin:0 0 9px;

    font-size:.95rem;
}

.detail-box p{
    margin:0;

    color:#c3cee0;

    font-size:.88rem;
}

.background-box h3{
    color:var(--orange);
}

.result-box h3{
    color:var(--green);
}

.impact-box h3{
    color:var(--blue);
}


/* =========================
   ESSAY POINT
========================= */

.essay-box{
    margin-top:13px;

    padding:17px;

    background:
        linear-gradient(
            135deg,
            rgba(167,139,250,.10),
            rgba(96,165,250,.06)
        );

    border:1px solid
        rgba(167,139,250,.35);

    border-radius:12px;
}

.essay-title{
    margin-bottom:6px;

    color:var(--purple);

    font-size:.8rem;
    font-weight:900;
}

.essay-box p{
    margin:0;

    color:#d4dcE9;

    font-size:.88rem;
}

.essay-template{
    margin-top:10px;

    padding:11px 13px;

    background:rgba(0,0,0,.18);

    border-left:3px solid var(--purple);

    color:#e4e9f3;

    font-size:.86rem;
}


/* =========================
   KEYWORDS
========================= */

.keyword-row{
    display:flex;
    flex-wrap:wrap;

    gap:6px;

    margin-top:14px;
}

.keyword{
    padding:4px 8px;

    color:#bcd4ff;

    background:rgba(96,165,250,.08);

    border:1px solid
        rgba(96,165,250,.22);

    border-radius:7px;

    font-size:.72rem;
}


/* =========================
   EMPTY
========================= */

.empty{
    padding:50px 20px;

    text-align:center;

    color:var(--sub);

    background:var(--card);

    border:1px dashed var(--line);
    border-radius:15px;
}

.empty h3{
    color:var(--text);
}


/* =========================
   FOOTER
========================= */

footer{
    padding:30px 20px;

    text-align:center;

    color:var(--sub);

    border-top:1px solid var(--line);

    font-size:.8rem;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .event-header{
        grid-template-columns:
            70px
            1fr
            auto;
    }

    .detail-grid{
        grid-template-columns:1fr;
    }

    .filter-label{
        width:100%;
    }
}


@media(max-width:600px){

    header{
        padding:42px 15px 35px;
    }

    main{
        padding:27px 13px 60px;
    }

    .search-row{
        grid-template-columns:1fr;
    }

    .reset-btn{
        padding:10px;
    }

    .event-header{
        grid-template-columns:1fr auto;
    }

    .event-year{
        grid-column:1 / -1;
    }

    .event-meta{
        grid-column:1 / -1;
    }

    .arrow{
        position:absolute;
        right:17px;
    }

    .event-header{
        position:relative;
    }

    .logic-arrow{
        display:none;
    }

    .logic-item{
        width:100%;
        text-align:center;
    }
}
</style>
</head>


<body>

<header>

<div class="header-inner">

    <a
        href="index.html"
        class="back-btn"

</header>


<main>

<!-- =========================
     INTRO
========================= -->

<section class="intro-box">

    <strong>論述の基本公式</strong>

    <p>
        歴史的事件は「単独」で起こるものではありません。
        前の時代の政治・社会・経済・宗教などの変化が
        次の事件の原因となり、その事件の結果が
        さらに次の時代を生み出します。
    </p>

    <div class="logic-flow">

        <div class="logic-item">

            事件
        </div>

        <div class="logic-arrow">
            →
        </div>

        <div class="logic-item">
            結果
        </div>

        <div class="logic-arrow">
            →
        </div>

        <div class="logic-item">
            長期的影響
        </div>

    </div>

</section>


<!-- =========================
     CONTROLS
========================= -->

<section class="control-panel">

    <div class="search-row">

        <input

            リセット
        </button>

    </div>


    <div class="filter-line">

        <span class="filter-label">
            時代
        </span>

        <button
            class="filter-btn active"
            data-type="era"
            data-value="all"
        >
            すべて
        </button>

        <button
            class="filter-btn"
            data-type="era"
            data-value="古代"
        >
            古代
        </button>

        <button
            class="filter-btn"
            data-type="era"
            data-value="中世"
        >
            中世
        </button>

        <button
            class="filter-btn"
            data-type="era"
            data-value="近世"
        >
            近世
        </button>

        <button
            class="filter-btn"
            data-type="era"
            data-value="近代"
        >
            近代
        </button>

        <button
            class="filter-btn"
            data-type="era"

            現代
        </button>

    </div>


    <div class="filter-line">

        <span class="filter-label">
            地域
        </span>

        <button
            class="filter-btn active"
            data-type="region"
            data-value="all"
        >
            すべて
        </button>

        <button
            class="filter-btn"
            data-type="region"
            data-value="中国"
        >
            中国・東アジア
        </button>

        <button
            class="filter-btn"
            data-type="region"
            data-value="ヨーロッパ"
        >
            ヨーロッパ
        </button>

        <button
            class="filter-btn"
            data-type="region"
            data-value="イスラーム"
        >
            イスラーム
        </button>

        <button
            class="filter-btn"
            data-type="region"
            data-value="インド"
        >
            インド
        </button>

        <button
            class="filter-btn"
            data-type="region"
            data-value="アメリカ"
        >
            アメリカ
        </button>

        <button
            class="filter-btn"
            data-type="region"
            data-value="世界"
        >
            世界史横断
        </button>

    </div>


    <div
        id="resultInfo"
        class="result-info"
    ></div>

</section>


<!-- =========================
     EVENTS
========================= -->

<div id="eventContainer"></div>

</main>


<footer>
    世界史ポータルサイト｜事件の因果関係・論述対策
</footer>

/* =========================================================
   STATE
========================================================= */

let currentEra = "all";
let currentRegion = "all";


/* =========================================================
   DOM
========================================================= */

const container =
    document.getElementById(
        "eventContainer"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const resultInfo =
    document.getElementById(
        "resultInfo"
    );


/* =========================================================
   FILTER
========================================================= */

function getFilteredEvents(){

    const search =
        searchInput.value
        .trim()
        .toLowerCase();

    return events.filter(event => {

        const eraOK =
            currentEra === "all" ||
            event.era === currentEra;

        const regionOK =
            currentRegion === "all" ||
            event.region === currentRegion;

        const text = [
            event.year,
            event.era,
            event.region,
            event.title,
            event.subtitle,
            event.background,
            event.result,
            event.impact,
            event.essay,
            event.keywords.join(" ")
        ]
        .join(" ")
        .toLowerCase();

        const searchOK =
            !search ||
            text.includes(search);

        return (
            eraOK &&
            regionOK &&
            searchOK
        );

    });
}


/* =========================================================
   EVENT CARD
========================================================= */

function createEventCard(event){

    return `

    <article
        class="event-card"
        data-id="${event.id}"
    >

        <div
            class="event-header"
            onclick="toggleEvent(${event.id})"
        >

            <div class="event-year">
                ${event.year}
            </div>


            <div>

                <h2 class="event-title">
                    ${event.title}
                </h2>

                <div class="event-subtitle">
                    ${event.subtitle}
                </div>

            </div>


            <div class="event-meta">

                <span class="badge era-badge">
                    ${event.era}
                </span>

                <span class="badge region-badge">
                    ${event.region}
                </span>

                <span class="arrow">
                    ▼
                </span>

            </div>

        </div>


        <div class="event-content">

            <div class="detail-grid">

                <section
                    class="detail-box background-box"
                >

                    <h3>
                        🟠 背景・原因
                    </h3>

                    <p>
                        ${event.background}
                    </p>

                </section>


                <section
                    class="detail-box result-box"
                >

                    <h3>
                        🟢 結果
                    </h3>

                    <p>
                        ${event.result}
                    </p>

                </section>


                <section
                    class="detail-box impact-box"
                >

                    <h3>
                        🔵 影響
                    </h3>

                    <p>
                        ${event.impact}
                    </p>

                </section>

            </div>


            <section class="essay-box">

                <div class="essay-title">
                    ✍️ 論述で使えるまとめ
                </div>

                <p>
                    ${event.essay}
                </p>

                <div class="essay-template">
                    <strong>論述の型：</strong>
                    「〜を背景に【事件】が起こり、
                    その結果〜となった。
                    さらに〜へ影響した。」
                </div>

            </section>


            <div class="keyword-row">

                ${event.keywords
                    .map(
                        keyword =>
                        `<span class="keyword">
                            ${keyword}
                        </span>`
                    )
                    .join("")}

            </div>

        </div>

    </article>

    `;
}


/* =========================================================
   RENDER
========================================================= */

function render(){

    const filtered =
        getFilteredEvents();

    if(filtered.length === 0){

        container.innerHTML = `

            <div class="empty">

                <h3>
                    該当する事件がありません
                </h3>

                <p>
                    検索語やフィルターを
                    変更してみてください。
                </p>

            </div>

        `;

    }else{

        container.innerHTML = `

            <div class="section-title">

                <h2>
                    重要事件一覧
                </h2>

                <span>
                    事件をクリックして因果関係を確認
                </span>

            </div>

            <div class="event-list">

                ${filtered
                    .map(createEventCard)
                    .join("")}

            </div>

        `;
    }

    resultInfo.textContent =
        `${filtered.length}件を表示中｜全${events.length}件`;

}


/* =========================================================
   ACCORDION
========================================================= */

function toggleEvent(id){

    const card =
        document.querySelector(
            `.event-card[data-id="${id}"]`
        );

    if(!card){
        return;
    }

    card.classList.toggle("open");

}


/* =========================================================
   FILTER BUTTON
========================================================= */

document
.querySelectorAll(".filter-btn")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            const type =
                button.dataset.type;

            const value =
                button.dataset.value;


            document
            .querySelectorAll(
                `[data-type="${type}"]`
            )
            .forEach(btn => {

                btn.classList.remove(
                    "active"
                );

            });


            button.classList.add(
                "active"
            );


            if(type === "era"){
                currentEra = value;
            }

            if(type === "region"){
                currentRegion = value;
            }


            render();

        }
    );

});


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    render
);


/* =========================================================
   RESET
========================================================= */

document
.getElementById("resetBtn")
.addEventListener(
    "click",
    () => {

        searchInput.value = "";

        currentEra = "all";
        currentRegion = "all";


        document
        .querySelectorAll(".filter-btn")
        .forEach(
            btn =>
            btn.classList.remove(
                "active"
            )
        );


        document
        .querySelectorAll(
            '[data-value="all"]'
        )
        .forEach(
            btn =>
            btn.classList.add(
                "active"
            )
        );


        render();

    }
);


/* =========================================================
   KEYBOARD SHORTCUT
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "/" &&
            document.activeElement.tagName !==
            "INPUT"
        ){

            event.preventDefault();

            searchInput.focus();

        }

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

render();

</script>
