<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界史ポータル｜一問一答</title>

<style>
:root{
    --bg:#080d18;
    --bg2:#0f1728;
    --card:#141d2f;
    --card2:#1b263c;
    --line:#293852;
    --text:#edf3ff;
    --sub:#aab7cd;
    --blue:#60a5fa;
    --cyan:#22d3ee;
    --green:#34d399;
    --yellow:#facc15;
    --orange:#fb923c;
    --red:#fb7185;
    --purple:#a78bfa;
    --shadow:0 12px 35px rgba(0,0,0,.3);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(96,165,250,.10),
            transparent 25%
        ),
        radial-gradient(
            circle at 90% 10%,
            rgba(167,139,250,.08),
            transparent 25%
        ),
        var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
    line-height:1.7;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   HEADER
========================= */

header{
    padding:55px 20px 45px;
    border-bottom:1px solid var(--line);
    background:
        linear-gradient(
            135deg,
            rgba(96,165,250,.10),
            rgba(167,139,250,.08)
        );
}

.header-inner{
    max-width:1250px;
    margin:auto;
}

.back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:var(--text);
    background:rgba(255,255,255,.06);
    border:1px solid var(--line);
    padding:9px 15px;
    border-radius:10px;
    transition:.2s;
}

.back-btn:hover{
    background:rgba(255,255,255,.12);
    transform:translateY(-1px);
}

.kicker{
    margin-top:35px;
    color:var(--cyan);
    font-size:.82rem;
    font-weight:800;
    letter-spacing:.12em;
}

h1{
    font-size:clamp(2rem,5vw,3.7rem);
    line-height:1.15;
    margin:8px 0 15px;
}

.header-description{
    max-width:850px;
    color:var(--sub);
    margin:0;
}

/* =========================
   MAIN
========================= */

main{
    max-width:1250px;
    margin:auto;
    padding:35px 20px 80px;
}

/* =========================
   DASHBOARD
========================= */

.dashboard{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:12px;
    margin-bottom:25px;
}

.stat{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:17px;
}

.stat-label{
    color:var(--sub);
    font-size:.78rem;
}

.stat-value{
    font-size:1.8rem;
    font-weight:900;
    margin-top:3px;
}

/* =========================
   CONTROL PANEL
========================= */

.control-panel{
    position:sticky;
    top:10px;
    z-index:100;
    background:rgba(8,13,24,.92);
    backdrop-filter:blur(15px);
    border:1px solid var(--line);
    border-radius:17px;
    padding:17px;
    margin-bottom:30px;
    box-shadow:var(--shadow);
}

.search-row{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    margin-bottom:13px;
}

.search{
    width:100%;
    background:var(--card);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    outline:none;
}

.search:focus{
    border-color:var(--blue);
    box-shadow:
        0 0 0 3px
        rgba(96,165,250,.12);
}

.reset-btn{
    border:1px solid var(--line);
    background:var(--card2);
    color:var(--text);
    border-radius:10px;
    padding:0 16px;
}

.reset-btn:hover{
    background:#263653;
}

.filter-line{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:7px;
    margin-top:9px;
}

.filter-label{
    width:70px;
    color:var(--sub);
    font-size:.82rem;
    font-weight:800;
}

.filter-btn{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--sub);
    border-radius:999px;
    padding:5px 11px;
    transition:.2s;
}

.filter-btn:hover{
    color:var(--text);
}

.filter-btn.active{
    color:var(--blue);
    background:rgba(96,165,250,.14);
    border-color:rgba(96,165,250,.45);
}

.mode-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}

.mode-btn{
    flex:1;
    min-width:130px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--sub);
    padding:9px 12px;
    border-radius:9px;
}

.mode-btn.active{
    color:var(--text);
    background:
        linear-gradient(
            135deg,
            rgba(96,165,250,.18),
            rgba(167,139,250,.15)
        );
    border-color:rgba(96,165,250,.45);
}

.result-info{
    margin-top:12px;
    color:var(--sub);
    font-size:.85rem;
}

/* =========================
   SECTION
========================= */

.section-title{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:15px;
    margin:40px 0 15px;
}

.section-title h2{
    margin:0;
    font-size:1.45rem;
}

.section-title span{
    color:var(--sub);
    font-size:.8rem;
}

/* =========================
   QUIZ CARD
========================= */

.quiz-list{
    display:grid;
    gap:13px;
}

.quiz-card{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:15px;
    overflow:hidden;
    transition:
        border-color .2s,
        transform .2s,
        box-shadow .2s;
}

.quiz-card:hover{
    border-color:#3c4e6d;
    box-shadow:var(--shadow);
}

.quiz-top{
    display:flex;
    align-items:center;
    gap:8px;
    padding:13px 16px 7px;
}

.number{
    color:var(--sub);
    font-size:.8rem;
    font-weight:800;
}

.badge{
    font-size:.72rem;
    padding:3px 8px;
    border-radius:999px;
    border:1px solid var(--line);
}

.region-badge{
    color:var(--cyan);
}

.era-badge{
    color:var(--purple);
}

.importance{
    margin-left:auto;
    letter-spacing:1px;
    font-size:.9rem;
}

.star3{
    color:var(--yellow);
}

.star2{
    color:var(--orange);
}

.star1{
    color:var(--sub);
}

.favorite-btn{
    border:none;
    background:transparent;
    color:#53627b;
    font-size:1.35rem;
    line-height:1;
    padding:3px 0 3px 7px;
    transition:.2s;
}

.favorite-btn:hover{
    transform:scale(1.15);
}

.favorite-btn.active{
    color:#facc15;
}

.question{
    padding:3px 16px 15px;
    font-size:1.03rem;
    font-weight:750;
}

/* =========================
   ANSWER
========================= */

.answer-area{
    padding:0 16px 16px;
}

.answer-cover{
    border:1px solid rgba(251,113,133,.45);
    background:
        linear-gradient(
            90deg,
            rgba(127,29,29,.65),
            rgba(185,28,28,.72)
        );
    border-radius:10px;
    color:#ffd9de;
    padding:13px 15px;
    cursor:pointer;
    user-select:none;
    position:relative;
    overflow:hidden;
    transition:.2s;
}

.answer-cover::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 3px,
            rgba(255,255,255,.035) 4px
        );
    pointer-events:none;
}

.answer-cover:hover{
    filter:brightness(1.12);
}

.cover-label{
    position:relative;
    z-index:1;
    font-weight:900;
}

.answer-content{
    display:none;
    border:1px solid rgba(52,211,153,.35);
    background:
        linear-gradient(
            135deg,
            rgba(52,211,153,.08),
            rgba(96,165,250,.06)
        );
    border-radius:10px;
    padding:15px;
}

.answer-content.show{
    display:block;
    animation:
        answerIn .22s ease;
}

@keyframes answerIn{
    from{
        opacity:0;
        transform:translateY(-5px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.answer-label{
    color:var(--green);
    font-size:.72rem;
    font-weight:900;
    margin-bottom:3px;
}

.answer{
    font-size:1.2rem;
    font-weight:900;
    margin-bottom:8px;
}

.explanation{
    color:#bdc9dc;
    font-size:.9rem;
}

/* =========================
   FOOTER
========================= */

footer{
    text-align:center;
    color:var(--sub);
    border-top:1px solid var(--line);
    padding:30px 20px;
    font-size:.82rem;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    border:1px dashed var(--line);
    border-radius:15px;
    padding:50px 20px;
    color:var(--sub);
}

.empty h3{
    color:var(--text);
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .dashboard{
        grid-template-columns:
            repeat(2,1fr);
    }

    .filter-label{
        width:100%;
    }
}

@media(max-width:600px){

    header{
        padding:42px 15px 35px;
    }

    main{
        padding:28px 13px 60px;
    }

    .dashboard{
        grid-template-columns:
            repeat(2,1fr);
    }

    .search-row{
        grid-template-columns:1fr;
    }

    .reset-btn{
        padding:10px;
    }

    .mode-btn{
        min-width:100%;
    }

    .quiz-top{
        flex-wrap:wrap;
    }

    .importance{
        margin-left:0;
    }

    .favorite-btn{
        margin-left:auto;
    }
}
</style>
</head>


<body>

<header>

    <div class="header-inner">

        <a href="index.html" class="back-btn">
            ← トップページへ戻る
        </a>

        <div class="kicker">
            WORLD HISTORY PORTAL / PAGE 05
        </div>

        <h1>
            世界史<br>
            一問一答
        </h1>

        <p class="header-description">
            共通テスト・私大入試で落としたくない重要用語を、
            赤シート感覚でセルフチェック。
            答えを隠した状態から自分で思い出し、
            分からなかった問題はチェックして後から復習しよう。
        </p>

    </div>

</header>


<main>

    <!-- =========================
         DASHBOARD
    ========================= -->

    <section class="dashboard">

        <div class="stat">
            <div class="stat-label">
                総問題数
            </div>
            <div class="stat-value" id="totalCount">
                0
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                ★★★ 最重要
            </div>
            <div class="stat-value" id="importantCount">
                0
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                チェック済み
            </div>
            <div class="stat-value" id="favoriteCount">
                0
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">
                復習モード
            </div>
            <div class="stat-value">
                ON
            </div>
        </div>

    </section>


    <!-- =========================
         CONTROLS
    ========================= -->

    <section class="control-panel">

        <div class="search-row">

            <input
                id="searchInput"
                class="search"
                type="search"
                placeholder="🔎 人名・用語・王朝・事件を検索..."
            >

            <button
                id="resetBtn"
                class="reset-btn"
            >
                リセット
            </button>

        </div>


        <div class="filter-line">

            <span class="filter-label">
                時代
            </span>

            <button
                class="filter-btn active"
                data-filter-type="era"
                data-value="all"
            >
                すべて
            </button>

            <button
                class="filter-btn"
                data-filter-type="era"
                data-value="古代"
            >
                古代
            </button>

            <button
                class="filter-btn"
                data-filter-type="era"
                data-value="中世"
            >
                中世
            </button>

            <button
                class="filter-btn"
                data-filter-type="era"
                data-value="近世"
            >
                近世
            </button>

            <button
                class="filter-btn"
                data-filter-type="era"
                data-value="近代"
            >
                近代
            </button>

            <button
                class="filter-btn"
                data-filter-type="era"
                data-value="現代"
            >
                現代
            </button>

        </div>


        <div class="filter-line">

            <span class="filter-label">
                地域
            </span>

            <button
                class="filter-btn active"
                data-filter-type="region"
                data-value="all"
            >
                すべて
            </button>

            <button
                class="filter-btn"
                data-filter-type="region"
                data-value="中国"
            >
                中国・東アジア
            </button>

            <button
                class="filter-btn"
                data-filter-type="region"
                data-value="ヨーロッパ"
            >
                ヨーロッパ
            </button>

            <button
                class="filter-btn"
                data-filter-type="region"
                data-value="イスラーム"
            >
                イスラーム
            </button>

            <button
                class="filter-btn"
                data-filter-type="region"
                data-value="インド"
            >
                インド
            </button>

            <button
                class="filter-btn"
                data-filter-type="region"
                data-value="アメリカ"
            >
                アメリカ
            </button>

            <button
                class="filter-btn"
                data-filter-type="region"
                data-value="世界"
            >
                世界史横断
            </button>

        </div>


        <div class="filter-line">

            <span class="filter-label">
                重要度
            </span>

            <button
                class="filter-btn active"
                data-filter-type="importance"
                data-value="all"
            >
                すべて
            </button>

            <button
                class="filter-btn"
                data-filter-type="importance"
                data-value="3"
            >
                ★★★
            </button>

            <button
                class="filter-btn"
                data-filter-type="importance"
                data-value="2"
            >
                ★★☆
            </button>

            <button
                class="filter-btn"
                data-filter-type="importance"
                data-value="1"
            >
                ★☆☆
            </button>

        </div>


        <div class="mode-row">

            <button
                class="mode-btn active"
                id="allMode"
            >
                📚 全問題
            </button>

            <button
                class="mode-btn"
                id="unansweredMode"
            >
                🔵 未チェック問題
            </button>

            <button
                class="mode-btn"
                id="reviewMode"
            >
                ⭐ 復習モード
            </button>

        </div>


        <div
            id="resultInfo"
            class="result-info"
        ></div>

    </section>


    <!-- =========================
         QUIZ
    ========================= -->

    <div id="quizContainer"></div>

</main>


<footer>
    世界史ポータルサイト｜一問一答セルフチェック
</footer>


<script>

/* =========================================================
   問題データ
   ★★★ = 最重要
   ★★☆ = 重要
   ★☆☆ = 発展・確認
   ========================================================= */

const questions = [

/* =========================================================
   古代・中国
========================================================= */

{
 id:1,
 era:"古代",
 region:"中国",
 importance:3,
 question:"前221年、中国を初めて統一して皇帝を称した人物は誰か？",
 answer:"秦の始皇帝（嬴政）",
 explanation:"秦王政は戦国七雄を滅ぼして中国を統一し、皇帝の称号を創設。郡県制、度量衡・文字・貨幣の統一など中央集権化を進めた。"
},

{
 id:2,
 era:"古代",
 region:"中国",
 importance:3,
 question:"前漢の武帝が北方の遊牧民族・匈奴への対抗策として派遣した人物は誰か？",
 answer:"張騫",
 explanation:"張騫の西域派遣をきっかけに漢と中央アジアとの関係が深まり、後のシルクロード発展につながった。"
},

{
 id:3,
 era:"古代",
 region:"中国",
 importance:3,
 question:"前漢の武帝が西方遠征などを通じて勢力を拡大した時代に、国家が保護した思想は何か？",
 answer:"儒学",
 explanation:"董仲舒の献策などを背景に、儒学が官学として重視され、皇帝支配を支える思想として発展した。"
},

{
 id:4,
 era:"古代",
 region:"中国",
 importance:3,
 question:"後漢の時代に製紙法を改良した宦官は誰か？",
 answer:"蔡倫",
 explanation:"蔡倫は105年に紙の製法を改良したとされる。紙は後に中国から中央アジア・イスラーム世界を経てヨーロッパへ伝わった。"
},

{
 id:5,
 era:"古代",
 region:"中国",
 importance:3,
 question:"三国時代の魏・蜀・呉のうち、曹操を基盤として華北を支配した国はどこか？",
 answer:"魏",
 explanation:"曹操は後漢末の実力者。死後、子の曹丕が後漢を滅ぼして魏を建国した。"
},

{
 id:6,
 era:"古代",
 region:"中国",
 importance:3,
 question:"隋を建国して南北朝の分裂を統一した人物は誰か？",
 answer:"文帝（楊堅）",
 explanation:"581年に隋を建国し、589年に陳を滅ぼして中国を統一。科挙や均田制などの制度整備も進めた。"
},

/* =========================================================
   古代・インド
========================================================= */

{
 id:7,
 era:"古代",
 region:"インド",
 importance:3,
 question:"インドを初めて大規模に統一したマウリヤ朝の初代君主は誰か？",
 answer:"チャンドラグプタ",
 explanation:"チャンドラグプタはマウリヤ朝を建国し、北インドの広範囲を統一した。"
},

{
 id:8,
 era:"古代",
 region:"インド",
 importance:3,
 question:"仏教に帰依し、ダルマによる統治を行ったマウリヤ朝の王は誰か？",
 answer:"アショーカ王",
 explanation:"カリンガ征服後に仏教へ接近。各地に磨崖碑・石柱碑を建て、仏教の保護と道徳政治を進めた。"
},

{
 id:9,
 era:"古代",
 region:"インド",
 importance:3,
 question:"4世紀ごろから北インドを支配し、サンスクリット文化が栄えた王朝は何か？",
 answer:"グプタ朝",
 explanation:"グプタ朝ではヒンドゥー教・サンスクリット文学・数学・天文学などが発展し、古典文化が栄えた。"
},

/* =========================================================
   古代・ヨーロッパ
========================================================= */

{
 id:10,
 era:"古代",
 region:"ヨーロッパ",
 importance:3,
 question:"アテネ民主政の全盛期を指導した政治家は誰か？",
 answer:"ペリクレス",
 explanation:"ペリクレス時代のアテネでは民主政が発展し、パルテノン神殿などの文化も栄えた。"
},

{
 id:11,
 era:"古代",
 region:"ヨーロッパ",
 importance:3,
 question:"東方遠征によってギリシア文化とオリエント文化の融合を進めた人物は誰か？",
 answer:"アレクサンドロス大王",
 explanation:"アケメネス朝を滅ぼして広大な帝国を形成。ヘレニズム文化の成立につながった。"
},

{
 id:12,
 era:"古代",
 region:"ヨーロッパ",
 importance:3,
 question:"ガリア遠征を行い、共和政ローマ末期の政治的実権を握った人物は誰か？",
 answer:"ユリウス＝カエサル",
 explanation:"ガリアを征服し、ポンペイウスらと対立。内戦に勝利して独裁権力を握ったが、紀元前44年に暗殺された。"
},

{
 id:13,
 era:"古代",
 region:"ヨーロッパ",
 importance:3,
 question:"ローマ帝国の初代皇帝とされ、元首政を開始した人物は誰か？",
 answer:"アウグストゥス（オクタウィアヌス）",
 explanation:"カエサル暗殺後の内戦を制し、共和政の形式を残しながら実質的な皇帝支配を開始した。"
},

{
 id:14,
 era:"古代",
 region:"ヨーロッパ",
 importance:3,
 question:"313年のミラノ勅令でキリスト教を公認したローマ皇帝は誰か？",
 answer:"コンスタンティヌス帝",
 explanation:"キリスト教を公認し、330年には都をコンスタンティノープルへ移した。"
},

{
 id:15,
 era:"古代",
 region:"ヨーロッパ",
 importance:3,

/* =========================================================
   STATE
========================================================= */

let currentEra = "all";
let currentRegion = "all";
let currentImportance = "all";
let currentMode = "all";

let favorites =
    JSON.parse(
        localStorage.getItem(
            "worldHistoryQuizFavorites"
        ) || "[]"
    );


/* =========================================================
   DOM
========================================================= */

const quizContainer =
    document.getElementById(
        "quizContainer"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const resultInfo =
    document.getElementById(
        "resultInfo"
    );

const totalCount =
    document.getElementById(
        "totalCount"
    );

const importantCount =
    document.getElementById(
        "importantCount"
    );

const favoriteCount =
    document.getElementById(
        "favoriteCount"
    );


/* =========================================================
   Stars
========================================================= */

function stars(level){

    if(level === 3){
        return `<span class="star3">★★★</span>`;
    }

    if(level === 2){
        return `<span class="star2">★★☆</span>`;
    }

    return `<span class="star1">★☆☆</span>`;
}


/* =========================================================
   Search
========================================================= */

function getSearchText(q){

    return [
        q.question,
        q.answer,
        q.explanation,
        q.era,
        q.region
    ]
    .join(" ")
    .toLowerCase();
}


/* =========================================================
   Filter
========================================================= */

function getFilteredQuestions(){

    const search =
        searchInput.value
        .trim()
        .toLowerCase();

    return questions.filter(q => {

        const eraOK =
            currentEra === "all" ||
            q.era === currentEra;

        const regionOK =
            currentRegion === "all" ||
            q.region === currentRegion;

        const importanceOK =
            currentImportance === "all" ||
            String(q.importance) ===
            String(currentImportance);

        const modeOK =
            currentMode === "all" ||
            (
                currentMode === "unanswered" &&
                !favorites.includes(q.id)
            ) ||
            (
                currentMode === "review" &&
                favorites.includes(q.id)
            );

        const searchOK =
            !search ||
            getSearchText(q).includes(search);

        return (
            eraOK &&
            regionOK &&
            importanceOK &&
            modeOK &&
            searchOK
        );

    });
}


/* =========================================================
   Save favorites
========================================================= */

function saveFavorites(){

    localStorage.setItem(
        "worldHistoryQuizFavorites",
        JSON.stringify(favorites)
    );

}


/* =========================================================
   Toggle favorite
========================================================= */

function toggleFavorite(id){

    if(favorites.includes(id)){

        favorites =
            favorites.filter(
                item => item !== id
            );

    }else{

        favorites.push(id);

    }

    saveFavorites();

    updateStats();

    render();

}


/* =========================================================
   Create card
========================================================= */

function createCard(q,index){

    const isFavorite =
        favorites.includes(q.id);

    return `

        <article
            class="quiz-card"
            data-id="${q.id}"
        >

            <div class="quiz-top">

                <span class="number">
                    Q${q.id}
                </span>

                <span class="badge region-badge">
                    ${q.region}
                </span>

                <span class="badge era-badge">
                    ${q.era}
                </span>

                <span class="importance">
                    ${stars(q.importance)}
                </span>

                <button
                    class="
                        favorite-btn
                        ${isFavorite ? "active" : ""}
                    "
                    onclick="
                        toggleFavorite(${q.id})
                    "
                    title="
                        ${isFavorite
                            ? "チェックを外す"
                            : "復習用にチェック"}
                    "
                >
                    ${isFavorite ? "★" : "☆"}
                </button>

            </div>


            <div class="question">
                ${q.question}
            </div>


            <div class="answer-area">

                <div
                    class="answer-cover"
                    onclick="showAnswer(${q.id})"
                    id="cover-${q.id}"
                >
                    <span class="cover-label">
                        🔴 タップして答えを表示
                    </span>
                </div>


                <div
                    class="answer-content"
                    id="answer-${q.id}"
                >

                    <div class="answer-label">
                        ANSWER
                    </div>

                    <div class="answer">
                        ${q.answer}
                    </div>

                    <div class="explanation">
                        ${q.explanation}
                    </div>

                </div>

            </div>

        </article>
    `;
}


/* =========================================================
   Render
========================================================= */

function render(){

    const filtered =
        getFilteredQuestions();

    if(filtered.length === 0){

        quizContainer.innerHTML = `

            <div class="empty">

                <h3>
                    該当する問題がありません
                </h3>

                <p>
                    検索条件またはフィルターを
                    変更してください。
                </p>

            </div>

        `;

    }else{

        quizContainer.innerHTML = `

            <div class="section-title">

                <h2>
                    一問一答
                </h2>

                <span>
                    答えを思い出してからタップ
                </span>

            </div>

            <div class="quiz-list">

                ${filtered
                    .map(createCard)
                    .join("")}

            </div>
        `;
    }


    updateStats();

}


/* =========================================================
   Show answer
========================================================= */

function showAnswer(id){

    const cover =
        document.getElementById(
            `cover-${id}`
        );

    const answer =
        document.getElementById(
            `answer-${id}`
        );

    if(!cover || !answer){
        return;
    }

    cover.style.display = "none";

    answer.classList.add("show");

}


/* =========================================================
   Stats
========================================================= */

function updateStats(){

    totalCount.textContent =
        questions.length;

    importantCount.textContent =
        questions.filter(
            q => q.importance === 3
        ).length;

    favoriteCount.textContent =
        favorites.length;

    const filtered =
        getFilteredQuestions();

    let modeText = "全問題";

    if(currentMode === "review"){
        modeText =
            "⭐ 復習モード";
    }

    if(currentMode === "unanswered"){
        modeText =
            "🔵 未チェック問題";
    }

    resultInfo.textContent =
        `${filtered.length}問を表示中｜${modeText}`;
}


/* =========================================================
   Filter buttons
========================================================= */

document
.querySelectorAll(".filter-btn")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            const type =
                button.dataset.filterType;

            const value =
                button.dataset.value;


            document
            .querySelectorAll(
                `[data-filter-type="${type}"]`
            )
            .forEach(btn =>
                btn.classList.remove(
                    "active"
                )
            );

            button.classList.add(
                "active"
            );


            if(type === "era"){
                currentEra = value;
            }

            if(type === "region"){
                currentRegion = value;
            }

            if(type === "importance"){
                currentImportance = value;
            }

            render();

        }
    );

});


/* =========================================================
   Mode buttons
========================================================= */

const allMode =
    document.getElementById(
        "allMode"
    );

const unansweredMode =
    document.getElementById(
        "unansweredMode"
    );

const reviewMode =
    document.getElementById(
        "reviewMode"
    );


function setMode(mode){

    currentMode = mode;

    [
        allMode,
        unansweredMode,
        reviewMode
    ]
    .forEach(btn =>
        btn.classList.remove(
            "active"
        )
    );


    if(mode === "all"){
        allMode.classList.add(
            "active"
        );
    }

    if(mode === "unanswered"){
        unansweredMode.classList.add(
            "active"
        );
    }

    if(mode === "review"){
        reviewMode.classList.add(
            "active"
        );
    }

    render();

}


allMode.addEventListener(
    "click",
    () => setMode("all")
);

unansweredMode.addEventListener(
    "click",
    () => setMode("unanswered")
);

reviewMode.addEventListener(
    "click",
    () => setMode("review")
);


/* =========================================================
   Search
========================================================= */

searchInput.addEventListener(
    "input",
    render
);


/* =========================================================
   Reset
========================================================= */

document
.getElementById("resetBtn")
.addEventListener(
    "click",
    () => {

        searchInput.value = "";

        currentEra = "all";
        currentRegion = "all";
        currentImportance = "all";
        currentMode = "all";


        document
        .querySelectorAll(".filter-btn")
        .forEach(btn =>
            btn.classList.remove(
                "active"
            )
        );


        document
        .querySelectorAll(
            '[data-value="all"]'
        )
        .forEach(btn =>
            btn.classList.add(
                "active"
            )
        );


        setMode("all");

    }
);


/* =========================================================
   Keyboard shortcut
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "/" &&
            document.activeElement.tagName !==
            "INPUT"
        ){

            event.preventDefault();

            searchInput.focus();

        }

    }
);


/* =========================================================
   初期化
========================================================= */

render();

</script>

</body>
</html>
