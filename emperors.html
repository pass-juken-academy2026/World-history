<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050812">
<meta name="description" content="世界史の主要人物を体系的・横断的に攻略する受験専用人物データベース">

<title>世界史 MASTER｜主要人物データベース</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#050812;
  --bg2:#0a1020;
  --panel:#101827;
  --panel2:#151f31;
  --border:#263652;
  --text:#edf3ff;
  --muted:#91a0b9;
  --blue:#4da3ff;
  --gold:#ffc928;
  --red:#ff667a;
  --green:#48d597;
  --purple:#a78bfa;
  --shadow:0 18px 50px rgba(0,0,0,.35);
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 0%,rgba(77,163,255,.10),transparent 30%),
    radial-gradient(circle at 80% 10%,rgba(167,139,250,.08),transparent 25%),
    var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;
  line-height:1.7;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(5,8,18,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.07);
}

.header-inner{
  width:min(1400px,94%);
  margin:auto;
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-mark{
  width:38px;
  height:38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#4da3ff,#7867ff);
  box-shadow:0 0 25px rgba(77,163,255,.25);
  font-weight:900;
}

.brand-text strong{
  display:block;
  font-size:15px;
  letter-spacing:.12em;
}

.brand-text span{
  display:block;
  color:var(--muted);
  font-size:11px;
}

.back-btn{
  padding:9px 16px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#0b1220;
  color:var(--text);
}

/* =========================
   HERO
========================= */

.hero{
  width:min(1400px,94%);
  margin:28px auto 18px;
}

.hero h1{
  font-size:clamp(28px,4vw,46px);
  line-height:1.15;
  margin-bottom:10px;
}

.hero p{
  color:var(--muted);
  max-width:850px;
}

.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-bottom:14px;
  padding:5px 10px;
  border-radius:999px;
  background:rgba(77,163,255,.09);
  border:1px solid rgba(77,163,255,.25);
  color:#83c2ff;
  font-size:12px;
}

/* =========================
   SEARCH
========================= */

.toolbar{
  width:min(1400px,94%);
  margin:20px auto;
  padding:16px;
  border:1px solid var(--border);
  border-radius:18px;
  background:rgba(16,24,39,.82);
  box-shadow:var(--shadow);
}

.search-wrap{
  position:relative;
}

.search-wrap input{
  width:100%;
  height:52px;
  padding:0 18px 0 46px;
  border-radius:13px;
  border:1px solid var(--border);
  background:#080e1a;
  color:var(--text);
  outline:none;
}

.search-wrap input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(77,163,255,.10);
}

.search-icon{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
}

/* =========================
   FILTER
========================= */

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:13px;
}

.filter-group{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  width:100%;
}

.filter-label{
  width:100%;
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.08em;
}

.filter-btn{
  padding:7px 11px;
  border:1px solid var(--border);
  border-radius:999px;
  background:#0b1220;
  color:#b8c4d9;
  font-size:12px;
  transition:.18s;
}

.filter-btn:hover{
  border-color:#456187;
}

.filter-btn.active{
  background:rgba(77,163,255,.12);
  border-color:var(--blue);
  color:#fff;
}

/* =========================
   STATS
========================= */

.stats{
  width:min(1400px,94%);
  margin:16px auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  color:var(--muted);
  font-size:13px;
}

.reset-btn{
  padding:7px 12px;
  border-radius:9px;
  border:1px solid var(--border);
  background:#0b1220;
  color:#aebbd0;
}

/* =========================
   GRID
========================= */

.grid{
  width:min(1400px,94%);
  margin:0 auto 50px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:16px;
}

.card{
  position:relative;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:18px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.025),transparent 35%),
    var(--panel);
  box-shadow:0 12px 35px rgba(0,0,0,.18);
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#3b5278;
}

.card-top{
  padding:18px 18px 12px;
}

.card-region{
  color:#77baff;
  font-size:11px;
  font-weight:700;
  margin-bottom:6px;
}

.card h2{
  font-size:21px;
  line-height:1.35;
  margin-bottom:2px;
}

.card-en{
  color:#73829a;
  font-size:11px;
}

.card-meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:12px;
}

.tag{
  padding:3px 7px;
  border-radius:6px;
  background:#0a1120;
  border:1px solid #23314a;
  color:#9eacc2;
  font-size:10px;
}

.stars{
  color:var(--gold);
  letter-spacing:1px;
}

.card-body{
  padding:0 18px 16px;
}

.card-summary{
  color:#bac6d8;
  font-size:13px;
  display:-webkit-box;
  -webkit-line-clamp:4;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.card-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 18px;
  border-top:1px solid rgba(255,255,255,.06);
}

.card-category{
  color:#65748c;
  font-size:10px;
}

.detail-btn{
  padding:7px 12px;
  border:1px solid #35537a;
  border-radius:9px;
  background:#0b1628;
  color:#dbeaff;
  font-size:12px;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  padding:24px;
  overflow:auto;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
}

.modal.open{
  display:block;
}

.modal-box{
  width:min(1050px,100%);
  margin:30px auto;
  border:1px solid #304361;
  border-radius:22px;
  background:#0d1524;
  box-shadow:0 30px 90px rgba(0,0,0,.55);
  overflow:hidden;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  padding:24px;
  border-bottom:1px solid rgba(255,255,255,.07);
}

.modal-head h2{
  font-size:30px;
  line-height:1.25;
}

.modal-close{
  width:38px;
  height:38px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#101a2b;
  color:#fff;
  font-size:20px;
}

.modal-content{
  padding:24px;
}

.detail-section{
  margin-bottom:25px;
}

.detail-section h3{
  margin-bottom:10px;
  padding-left:10px;
  border-left:3px solid var(--blue);
  font-size:16px;
}

.detail-section p{
  color:#bac6d8;
  font-size:14px;
}

.detail-list{
  display:grid;
  gap:8px;
}

.detail-item{
  padding:11px 13px;
  border:1px solid #24334d;
  border-radius:10px;
  background:#0a1120;
  color:#c4d0e2;
  font-size:13px;
}

.detail-item strong{
  color:#fff;
}

/* =========================
   EVENT / LAW
========================= */

.event-list{
  display:grid;
  gap:10px;
}

.event{
  padding:14px;
  border:1px solid #253650;
  border-radius:12px;
  background:#0a1120;
}

.event-date{
  color:var(--gold);
  font-size:11px;
  font-weight:800;
}

.event-title{
  margin:3px 0 5px;
  font-weight:800;
}

.event-body{
  color:#aebbd0;
  font-size:13px;
}

.law{
  border-left:3px solid var(--purple);
}

.trap{
  border-left:3px solid var(--red);
}

.chain{
  border-left:3px solid var(--green);
}

/* =========================
   COMPARE
========================= */

.compare-bar{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  z-index:70;
  display:none;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  border:1px solid #3c5477;
  border-radius:14px;
  background:rgba(10,17,30,.94);
  box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.compare-bar.show{
  display:flex;
}

.compare-btn{
  padding:8px 13px;
  border:1px solid #45658e;
  border-radius:9px;
  background:#11213a;
  color:#fff;
}

/* =========================
   EMPTY
========================= */

.empty{
  grid-column:1/-1;
  padding:60px 20px;
  text-align:center;
  color:var(--muted);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){
  .header-inner,
  .hero,
  .toolbar,
  .stats,
  .grid{
    width:92%;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .modal{
    padding:10px;
  }

  .modal-box{
    margin:10px auto;
  }

  .modal-head,
  .modal-content{
    padding:18px;
  }

  .modal-head h2{
    font-size:24px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">史</div>

      <div class="brand-text">
        <strong>WORLD HISTORY PORTAL</strong>
        <span>主要人物データベース</span>
      </div>
    </div>

    <a class="back-btn" href="index.html">
      ← トップへ戻る
    </a>
  </div>
</header>

<main>

<section class="hero">

  <div class="hero-badge">
    ● WORLD HISTORY / KEY FIGURES
  </div>

  <h1>主要人物データベース</h1>

  <p>
    皇帝・王・政治家・思想家・宗教家・革命家など、
    高校世界史で重要な人物を横断的に整理。
    人物名だけでなく、法律・条約・戦争・政策・思想・関連人物から検索できます。
  </p>

</section>


<section class="toolbar">

  <div class="search-wrap">
    <span class="search-icon">⌕</span>

    <input
      id="searchInput"
      type="search"
      placeholder="人物名・別名・国・法律・条約・事件・年代・制度などで検索..."
      autocomplete="off"
    >
  </div>


  <div class="filters">

    <div class="filter-group">

      <div class="filter-label">
        時代
      </div>

      <button class="filter-btn active" data-filter="era" data-value="all">
        すべて
      </button>

      <button class="filter-btn" data-filter="era" data-value="ancient">
        古代
      </button>

      <button class="filter-btn" data-filter="era" data-value="medieval">
        中世
      </button>

      <button class="filter-btn" data-filter="era" data-value="earlymodern">
        近世
      </button>

      <button class="filter-btn" data-filter="era" data-value="modern">
        近代
      </button>

      <button class="filter-btn" data-filter="era" data-value="contemporary">
        現代
      </button>

    </div>


    <div class="filter-group">

      <div class="filter-label">
        地域
      </div>

      <button class="filter-btn active" data-filter="region" data-value="all">
        すべて
      </button>

      <button class="filter-btn" data-filter="region" data-value="china">
        中国
      </button>

      <button class="filter-btn" data-filter="region" data-value="europe">
        ヨーロッパ
      </button>

      <button class="filter-btn" data-filter="region" data-value="islam">
        イスラーム
      </button>

      <button class="filter-btn" data-filter="region" data-value="india">
        インド
      </button>

      <button class="filter-btn" data-filter="region" data-value="russia">
        ロシア・東欧
      </button>

      <button class="filter-btn" data-filter="region" data-value="america">
        アメリカ
      </button>

      <button class="filter-btn" data-filter="region" data-value="africa">
        アフリカ
      </button>

      <button class="filter-btn" data-filter="region" data-value="middleeast">
        中東
      </button>

      <button class="filter-btn" data-filter="region" data-value="roman">
        ローマ
      </button>

    </div>


    <div class="filter-group">

      <div class="filter-label">
        人物タイプ
      </div>

      <button class="filter-btn active" data-filter="type" data-value="all">
        すべて
      </button>

      <button class="filter-btn" data-filter="type" data-value="ruler">
        皇帝・王・君主
      </button>

      <button class="filter-btn" data-filter="type" data-value="politician">
        政治家・指導者
      </button>

      <button class="filter-btn" data-filter="type" data-value="thinker">
        思想家・学者
      </button>

      <button class="filter-btn" data-filter="type" data-value="religion">
        宗教・文化
      </button>

      <button class="filter-btn" data-filter="type" data-value="revolution">
        革命・社会主義
      </button>

    </div>

  </div>

</section>


<section class="stats">

  <span id="resultCount">
    0人
  </span>

  <button id="resetBtn" class="reset-btn">
    条件をリセット
  </button>

</section>


<section id="peopleGrid" class="grid"></section>

</main>


<div id="personModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <div>
        <div id="modalRegion" class="card-region"></div>
        <h2 id="modalName"></h2>
        <div id="modalEn" class="card-en"></div>
      </div>

      <button id="modalClose" class="modal-close">
        ×
      </button>

    </div>

    <div id="modalContent" class="modal-content"></div>

  </div>

</div>


<div id="compareBar" class="compare-bar">

  <span>
    比較：
    <strong id="compareCount">0</strong>人
  </span>

  <button id="compareBtn" class="compare-btn">
    比較する
  </button>

  <button id="clearCompare" class="compare-btn">
    解除
  </button>

</div>


<script>
  const P=(x)=>({id:x[0],name:x[1],en:x[2],affiliation:x[3],era:x[4],region:x[5],importance:x[6],period:x[7],summary:x[8],achievements:x[9]||[],traps:x[10]||[],aliases:x[11]||[x[1]]});

const DATA=[
  P(["qin-shihuang","秦の始皇帝","Qin Shi Huang","秦","古代","東アジア",3,"前259〜前210年","戦国時代の諸国を統一し、中国史上初めて「皇帝」を称した人物。",["前221年、韓・趙・魏・楚・燕・斉を滅ぼして中国を統一した。","郡県制を全国に広げ、諸侯を介さない中央集権的支配を進めた。","度量衡・貨幣・文字・車軌などを統一し、帝国統治の共通基盤を整えた。","北方では匈奴に備え、既存の城壁を接続・修築して長城建設を進めた。"],["「中国を初めて統一」＝始皇帝。漢の武帝ではない。","始皇帝が統一したのは前221年。","万里の長城は始皇帝がゼロから造ったものではなく、戦国期の城壁をつないだ点に注意。"],["秦の始皇帝"]]),
  P(["han-wudi","武帝","Emperor Wu of Han","前漢","古代","東アジア",3,"前156〜前87年","前漢の最盛期を築き、匈奴遠征と儒学官学化を進めた皇帝。",["衛青・霍去病らを用いて匈奴を圧迫し、北方への勢力を拡大した。","張騫を西域へ派遣し、西域との交通・交流を強化した。","董仲舒の進言を背景に儒学を重視し、五経博士を置いた。","塩・鉄の専売や均輸・平準などを実施し、国家財政を強化した。"],["匈奴遠征＝武帝期。始皇帝は北方防衛・長城。","張騫＝武帝に派遣された人物。","儒学の官学化と結びつく代表的皇帝＝武帝。"],["武帝"]]),
  P(["cao-cao","曹操","Cao Cao","魏・後漢末","古代","東アジア",2,"155〜220年","後漢末に華北を支配し、魏の基礎を築いた政治家・軍人。",["後漢末の群雄割拠の中で華北を統一した。","屯田制を利用して兵糧を確保し、軍事力を安定させた。","献帝を奉じて「挙漢天子以令諸侯」とされる政治的立場を築いた。","赤壁の戦いでは孫権・劉備連合軍に敗れ、中国統一を阻まれた。","中国・東アジアにおける重要人物として登場する","魏武帝（曹操）に関連する事件・制度・思想を確認する"],["曹操自身が魏を正式に建国したわけではない。魏の建国者は曹丕。","赤壁＝曹操 vs 孫権・劉備。","三国志の『魏・呉・蜀』のうち魏の基礎を築いた人物。","魏武帝（曹操）は関連人物・制度・年代とセットで整理する。"],["曹操","魏武帝（曹操）"]]),
  P(["taizong","太宗（李世民）","Emperor Taizong","唐","中世","東アジア",3,"598〜649年","唐の基礎を固めた皇帝。「貞観の治」で知られる。",["玄武門の変を経て即位し、唐の統治体制を安定させた。","魏徴ら有能な臣下の意見を聞き、政治を安定させた。","律令体制を整え、均田制・租庸調制など唐の国家体制を発展させた。","突厥を撃破して北方支配を拡大し、「天可汗」と称された。"],["貞観の治＝太宗。","開元の治＝玄宗。","則天武后＝太宗の後、唐の政治を握った人物。"],["太宗（李世民）"]]),
  P(["wu-zetian","則天武后","Wu Zetian","唐・武周","中世","東アジア",2,"624〜705年","中国史上唯一の正式な女性皇帝。",["高宗の死後、実権を掌握して政治を主導した。","690年に国号を周とし、自ら皇帝を称した。","科挙・官僚登用を活用して貴族勢力を抑えた。","唐王朝復活後も政治制度や人材登用に影響を残した。"],["中国史上唯一の正式な女性皇帝＝則天武后。","彼女の国号は唐ではなく「周」。","玄宗の開元の治とは別時代。"],["則天武后"]]),
  P(["song-taizu","太祖（趙匡胤）","Emperor Taizu of Song","北宋","中世","東アジア",3,"927〜976年","五代十国の分裂を収束させ、北宋を建国した皇帝。",["960年、宋を建国して五代十国の分裂を終息させる方向へ進めた。","文治主義を重視し、軍人勢力の政治介入を抑制した。","科挙を重視し、文官中心の統治体制を強化した。","節度使の軍事力を抑えて中央集権化を進めた。"],["宋の建国者＝趙匡胤（太祖）。","元を建国したのはフビライ。","北宋960〜1127、南宋1127〜1279。"],["太祖（趙匡胤）"]]),

const IDENTITY_LOOKUP = {};

for(
  const [key,names]
  of Object.entries(IDENTITY_GROUPS)
){
  for(const name of names){
    IDENTITY_LOOKUP[name] = key;
  }
}


function normalizeText(value){

  return String(value ?? "")
    .normalize("NFKC")
    .toLowerCase()
    .replace(/[＝‐-–—]/g,"=")
    .replace(/\s+/g,"")
    .trim();

}


function identityKey(person){

  const names = [
    person.name,
    ...(person.aliases || [])
  ];

  for(const name of names){

    const normalized =
      normalizeText(name);

    if(IDENTITY_LOOKUP[normalized]){
      return IDENTITY_LOOKUP[normalized];
    }

    if(IDENTITY_LOOKUP[name]){
      return IDENTITY_LOOKUP[name];
    }
  }

  return person.id;
}

const merged = new Map();


for(const person of PEOPLE){

  const key =
    identityKey(person);

  if(!merged.has(key)){

    merged.set(
      key,
      {
        ...person,
        aliases:[
          ...(person.aliases || [])
        ]
      }
    );

    continue;
  }


  const base =
    merged.get(key);


  base.aliases = [
    ...new Set([
      ...(base.aliases || []),
      ...(person.aliases || []),
      person.name
    ])
  ];


  for(
    const field
    of [
      "achievements",
      "traps",
      "chain",
      "compare",
      "events",
      "laws",
      "related",
      "tags"
    ]
  ){

    base[field] = [
      ...(base[field] || []),
      ...(person[field] || [])
    ];

    base[field] =
      [
        ...new Set(
          base[field]
        )
      ];

  }

}


PEOPLE =
  [...merged.values()];


function searchPerson(person){

  const query =
    normalizeText(
      state.search
    );

  if(!query){
    return true;
  }


  const haystack =
    normalizeText(
      JSON.stringify(person)
    );


  if(haystack.includes(query)){
    return true;
  }


  const alias =
    SEARCH_ALIASES[
      state.search.trim()
    ];


  if(alias){

    return PEOPLE.some(
      p =>
        p.id === alias &&
        p.id === person.id
    );

  }


  return false;
}


function matchPerson(person){

  if(!searchPerson(person)){

  if(

  if(
    state.region !== "all" &&
    person.regionKey !== state.region &&
    person.region !== state.region
  ){
    return false;
  }


  if(
    state.type !== "all" &&
    person.type !== state.type
  ){
    return false;
  }


  return true;
}


/* =========================
   星
========================= */

function stars(value){

  const n =
    Math.max(
      1,
      Math.min(
        5,
        Number(value || 1)
      )
    );

  return "★".repeat(n)
       + "☆".repeat(5-n);
}


/* =========================
   CARD
========================= */

function renderCard(person){

  const checked =
    selected.has(person.id);

  const tags =
    (person.tags || [])
      .slice(0,5)
      .map(
        tag =>
          `<span class="tag">${tag}</span>`
      )
      .join("");


  return `

    <article class="card">

      <div class="card-top">

        <div class="card-region">
          ${person.region || ""}
        </div>

        <h2>
          ${person.name}
        </h2>

        <div class="card-en">
          ${person.en || ""}
        </div>

        <div class="card-meta">

          <span class="stars">
            ${stars(person.importance)}
          </span>

          ${tags}

        </div>

      </div>


      <div class="card-body">

        <p class="card-summary">
          ${person.summary || ""}
        </p>

      </div>


      <div class="card-bottom">

        <div class="card-category">
          ${person.eraLabel || ""} /
          ${person.typeLabel || ""}
        </div>


        <div>

          <button
            class="detail-btn"
            data-detail="${person.id}"
          >
            詳細 →
          </button>

        </div>

      </div>

    </article>

  `;
}


function render(){

  const filtered =
    PEOPLE.filter(
      matchPerson
    );


  resultCount.textContent =
    `${filtered.length}人`;


  if(!filtered.length){

    grid.innerHTML = `
      <div class="empty">
        該当する人物が見つかりません。
        <br>
        人物名・別名・法律・条約・事件などで検索してみてください。
      </div>
    `;

    return;
  }


  grid.innerHTML =
    filtered
      .map(renderCard)
      .join("");


  document
    .querySelectorAll("[data-detail]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          openPerson(
            button.dataset.detail
          );

        }
      );

    });

}
  function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function openPerson(id){

  const person =
    PEOPLE.find(
      p => p.id === id
    );

  if(!person){
    return;
  }


  document.getElementById(
    "modalRegion"
  ).textContent =
    person.region || "";


  document.getElementById(
    "modalName"
  ).textContent =
    person.name;


  document.getElementById(
    "modalEn"
  ).textContent =
    person.en || "";


  let html = "";


  /* 基本情報 */

  html += `

    <section class="detail-section">

      <h3>基本情報</h3>

      <div class="detail-list">

        <div class="detail-item">
          <strong>時代：</strong>
          ${person.eraLabel || ""}
        </div>

        <div class="detail-item">
          <strong>地域：</strong>
          ${person.region || ""}
        </div>

        <div class="detail-item">
          <strong>肩書：</strong>
          ${person.title || ""}
        </div>

        <div class="detail-item">
          <strong>国家・所属：</strong>
          ${person.affiliation || ""}
        </div>

        <div class="detail-item">
          <strong>活躍時期：</strong>
          ${person.reign || ""}
        </div>

      </div>

    </section>

  `;


  /* 概要 */

  if(person.summary){

    html += `

      <section class="detail-section">

        <h3>人物概要</h3>

        <p>
          ${person.summary}
        </p>

      </section>

    `;

  }


  /* 重要事項 */

  if(
    person.achievements &&
    person.achievements.length
  ){

    html += `

      <section class="detail-section">

        <h3>主要実績</h3>

        <div class="detail-list">

          ${person.achievements
            .map(
              x =>
                `<div class="detail-item">• ${x}</div>`
            )
            .join("")}

        </div>

      </section>

    `;

  }


  /* 事件 */

  if(person.events.length){

    html += `

      <section class="detail-section">

        <h3>重要事件・出来事</h3>

        <div class="event-list">

          ${person.events
            .map(
              event => `

                <div class="event">

                  <div class="event-date">
                    ${event.date || ""}
                  </div>

                  <div class="event-title">
                    ${event.title || ""}
                  </div>

                  <div class="event-body">
                    ${event.body || ""}
                  </div>

                  ${
                    event.significance
                    ?
                    `<div class="event-body">
                      <strong>意義：</strong>
                      ${event.significance}
                    </div>`
                    :
                    ""
                  }

                </div>

              `
            )
            .join("")}

        </div>

      </section>

    `;

  }


  /* 法律・制度 */

  if(person.laws.length){

    html += `

      <section class="detail-section">

        <h3>法律・制度・条約</h3>

        <div class="event-list">

          ${person.laws
            .map(
              law => `

                <div class="event law">

                  <div class="event-date">
                    ${law.date || ""}
                  </div>

                  <div class="event-title">
                    ${law.name || ""}
                  </div>

                  <div class="event-body">

                    ${
                      law.type
                      ?
                      `<strong>種類：</strong>${law.type}<br>`
                      :
                      ""
                    }

                    ${
                      law.purpose
                      ?
                      `<strong>目的：</strong>${law.purpose}<br>`
                      :
                      ""
                    }

                    ${
                      law.content
                      ?
                      `<strong>内容：</strong>${law.content}<br>`
                      :
                      ""
                    }

                    ${
                      law.significance
                      ?
                      `<strong>重要性：</strong>${law.significance}`
                      :
                      ""
                    }

                  </div>

                </div>

              `
            )
            .join("")}

        </div>

      </section>

    `;

  }


  /* 因果関係 */

  if(person.chain.length){

    html += `

      <section class="detail-section">

        <h3>歴史のつながり</h3>

        <div class="detail-list">

          <div class="detail-item chain">

            ${person.chain.join(" → ")}

          </div>

        </div>

      </section>

    `;

  }


  /* 混同注意 */

  if(person.traps.length){

    html += `

      <section class="detail-section">

        <h3>受験ひっかけ・混同注意</h3>

        <div class="detail-list">

          ${person.traps
            .map(
              x =>
                `<div class="detail-item trap">⚠ ${x}</div>`
            )
            .join("")}

        </div>

      </section>

    `;

  }


  /* 論述 */

  if(person.essay){

    html += `

      <section class="detail-section">

        <h3>論述・記述で使えるポイント</h3>

        <div class="detail-item">

          ${person.essay}

        </div>

      </section>

    `;

  }


  /* 関連人物 */

  if(person.related.length){

    const related =
      person.related
        .map(
          id =>
            PEOPLE.find(
              p => p.id === id
            )
        )
        .filter(Boolean);


    if(related.length){

      html += `

        <section class="detail-section">

          <h3>関連人物</h3>

          <div class="detail-list">

            ${related
              .map(
                p => `
                  <button
                    class="detail-item"
                    data-related="${p.id}"
                    style="
                      text-align:left;
                      cursor:pointer;
                    "
                  >
                    ${p.name}
                  </button>
                `
              )
              .join("")}

          </div>

        </section>

      `;

    }

  }


  document.getElementById(
    "modalContent"
  ).innerHTML = html;


  modal.classList.add("open");


  document
    .querySelectorAll("[data-related]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          openPerson(
            button.dataset.related
          );

        }
      );

    });

}


function closePerson(){

  modal.classList.remove(
    "open"
  );

}


modalClose.addEventListener(
  "click",
  closePerson
);


modal.addEventListener(
  "click",
  event => {

    if(
      event.target === modal
    ){
      closePerson();
    }

  }
);


/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
  "input",
  () => {

    state.search =
      searchInput.value;

    render();

  }
);


/* =========================
   FILTER
========================= */

document
  .querySelectorAll(".filter-btn")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const filter =
          button.dataset.filter;

        const value =
          button.dataset.value;


        state[filter] =
          value;


        document
          .querySelectorAll(
            `.filter-btn[data-filter="${filter}"]`
          )
          .forEach(
            b =>
              b.classList.toggle(
                "active",
                b.dataset.value === value
              )
          );


        render();

      }
    );

  });


/* =========================
   RESET
========================= */

resetBtn.addEventListener(
  "click",
  () => {

    Object.assign(
      state,
      {
        era:"all",
        region:"all",
        importance:"all",
        type:"all",
        search:""
      }
    );


    searchInput.value = "";


    document
      .querySelectorAll(".filter-btn")
      .forEach(
        button => {

          button.classList.toggle(
            "active",
            button.dataset.value === "all"
          );

        }
      );


    render();

  }
);


/* =========================
   キーボード
========================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "/" &&
      document.activeElement !== searchInput
    ){

      event.preventDefault();

      searchInput.focus();

    }


    if(
      event.key === "Escape"
    ){

      closePerson();

    }

  }
);


/* =========================
   START
========================= */

render();

</script>

</html>
